<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>开通会员 · 国复数据</title>
<link rel="stylesheet" href="assets/style.css"/>
<link rel="stylesheet" href="assets/theme.css"/></head>
<body>
<header id="topnav"></header>

<div class="wrap" style="padding:26px 20px 46px;max-width:1000px">
  <div id="payRoot"></div>
</div>

<footer id="footer"></footer>
<script src="assets/app.js"></script>
<script>
renderHeader('');renderFooter();

let ses=null;try{ses=JSON.parse(localStorage.getItem('gf_session')||'null')}catch(e){}
if(!ses){location.replace('login.html')}
else{

const report=new URLSearchParams(location.search).get('report')||'';

const pkgCard=(name,price,per,feats,hot)=>`
  <div style="flex:1;min-width:200px;border:1px solid ${hot?'#A8894F':'var(--line)'};border-radius:10px;padding:18px 20px;position:relative;background:${hot?'#fffdf5':'#fff'}">
    ${hot?'<span style="position:absolute;top:-10px;right:14px;background:#A8894F;color:#fff;font-size:10.5px;font-weight:700;border-radius:8px;padding:2px 10px">最受欢迎</span>':''}
    <b style="font-size:15px;color:#123f86">${name}</b>
    <div style="margin:10px 0"><b style="font-size:24px;color:#A8894F">${price}</b><span style="font-size:12px;color:#8A939E"> ${per}</span></div>
    <div style="font-size:12px;color:#46505C;line-height:2">${feats.map(f=>'· '+f).join('<br>')}</div>
  </div>`;

document.getElementById('payRoot').innerHTML=`
  <div class="card" style="padding:26px 30px;margin-bottom:18px;background:linear-gradient(135deg,#12283D,#1E3E5C);color:#fff">
    <div style="font-size:11px;letter-spacing:2.5px;color:#9AA6B2">MEMBERSHIP</div>
    <h1 style="font-size:23px;margin:8px 0 8px">开通会员，解锁全部报告下载</h1>
    <div style="font-size:13px;color:#C7CFD8;line-height:1.9">彩虹系列报告（白皮书 / 蓝皮书 / 绿皮书 / 红皮书 / 金皮书 / 银皮书）全场不限量下载<br>每月 1 日自动发放 5 张报告券 · 我的关注动态实时推送</div>
    ${report?`<div style="margin-top:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:10px 14px;font-size:12.5px">您请求下载的报告：<b style="color:#ffd94d">${report}</b> —— 开通会员后即可下载</div>`:''}
  </div>

  ${ses.member?`
  <div class="card" style="padding:30px;text-align:center;margin-bottom:18px">
    <div style="font-size:16px;font-weight:700;color:#123f86">您已是会员（有效期至 ${ses.expire}）</div>
    <div style="font-size:12.5px;color:#8A939E;margin:8px 0 16px">可直接返回工作台下载全部报告</div>
    <a href="workbench.html" class="auth-btn" style="display:inline-block;width:auto;padding:11px 34px;letter-spacing:0;text-decoration:none">进入我的工作台 →</a>
  </div>`:`

  <!-- 方式一：直接付费成为会员 -->
  <div class="card" style="padding:22px 26px;margin-bottom:18px">
    <div style="display:flex;align-items:baseline;margin-bottom:14px"><b style="font-size:16px;color:#123f86">方式一 · 直接付费成为会员</b><span style="font-size:11px;color:#8A939E;margin-left:10px">在线支付，即时开通</span></div>
    <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
      <div style="flex:1;min-width:240px">
        <div style="display:flex;align-items:baseline;gap:8px"><b style="font-size:32px;color:#A8894F">¥ 1,999</b><span style="font-size:12.5px;color:#8A939E">/ 年 · 单账号</span></div>
        <div style="font-size:12.5px;color:#46505C;line-height:2;margin-top:8px">· 全部彩虹系列报告不限量下载<br>· 每月 5 张报告券<br>· 我的关注动态推送 · 专属客服</div>
      </div>
      <div style="min-width:250px">
        <div style="font-size:12.5px;font-weight:600;color:#46505C;margin-bottom:8px">选择支付方式</div>
        <div id="payWays" style="display:flex;gap:8px;margin-bottom:14px">
          <button class="chip on" data-w="微信支付">微信支付</button>
          <button class="chip" data-w="支付宝">支付宝</button>
          <button class="chip" data-w="对公转账">对公转账</button>
        </div>
        <button class="auth-btn" id="payBtn" style="letter-spacing:0">立即支付 ¥1,999 开通会员</button>
        <div class="auth-err" id="payMsg" style="text-align:center"></div>
      </div>
    </div>
  </div>

  <!-- 方式二：联系客服购买会员套餐 -->
  <div class="card" style="padding:22px 26px">
    <div style="display:flex;align-items:baseline;margin-bottom:14px"><b style="font-size:16px;color:#123f86">方式二 · 联系客服购买会员套餐</b><span style="font-size:11px;color:#8A939E;margin-left:10px">多账号 / 集团采购 / 定制服务</span></div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px">
      ${pkgCard('基础版','¥ 1,999','/ 年 · 1 个账号',['全部报告不限量下载','每月 5 张报告券'],false)}
      ${pkgCard('企业版','¥ 9,999','/ 年 · 10 个账号',['基础版全部权益','子账号管理 · 使用报表','专属客户经理'],true)}
      ${pkgCard('集团版','面议','不限账号 · 定制',['企业版全部权益','API 数据接口','定制研究报告'],false)}
    </div>
    <div style="display:flex;gap:24px;align-items:center;border-top:1px dashed var(--line);padding-top:16px;flex-wrap:wrap">
      <div style="font-size:13px;color:#46505C;line-height:2">
        客服热线：<b style="color:#123f86;font-size:16px">+86 10-84351696</b><br>
        <span style="font-size:12px;color:#8A939E">工作日 9:00 – 18:00 · 或扫码添加客服微信，备注「会员套餐」</span>
      </div>
      <div style="text-align:center"><img src="assets/img/qr_wechat.png" alt="客服微信二维码" style="width:92px;height:92px;border:1px solid var(--line);border-radius:8px"><div style="font-size:11px;color:#8A939E;margin-top:4px">客服微信</div></div>
    </div>
  </div>`}
`;

document.querySelectorAll('#payWays .chip').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#payWays .chip').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
});
const payBtn=document.getElementById('payBtn');
if(payBtn)payBtn.onclick=()=>{
  const way=(document.querySelector('#payWays .chip.on')||{}).dataset?document.querySelector('#payWays .chip.on').dataset.w:'微信支付';
  payBtn.disabled=true;payBtn.textContent='支付处理中…';
  setTimeout(()=>{
    ses.member=true;
    const d=new Date();d.setFullYear(d.getFullYear()+1);
    ses.expire=d.toISOString().slice(0,10);
    ses.coupons=(ses.coupons||0)+10;
    localStorage.setItem('gf_session',JSON.stringify(ses));
    document.getElementById('payMsg').style.color='#0d7a5f';
    document.getElementById('payMsg').textContent=`${way}支付成功，会员已开通（有效期至 ${ses.expire}），正在跳转工作台…`;
    setTimeout(()=>location.href='workbench.html',1200);
  },900);
};
}
</script>

</body></html>
